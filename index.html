<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karl Körner</title>
  <meta name="description" content="Persönliche Website von Karl Körner.">
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1d1d1b;
      --muted: #6b6a65;
      --accent: #2f5d50;
      --line: #dcd8ce;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161614;
        --text: #ecebe6;
        --muted: #9a998f;
        --accent: #7fb8a4;
        --line: #2e2d29;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 15vh 20px 60px;
    }
    h1 {
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      line-height: 1.05;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.15rem;
      margin: 0 0 48px;
    }
    h2 {
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 40px 0 10px;
      font-weight: 600;
    }
    p { margin: 0 0 16px; font-size: 1.1rem; }
    a { color: var(--accent); text-underline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 1.05rem; }
    li:last-child { border-bottom: 1px solid var(--line); }
    footer {
      margin-top: 64px;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Karl Körner</h1>
    <p class="tagline">Willkommen auf meiner Website.</p>

    <h2>Über mich</h2>
    <p>Hier steht bald ein kurzer Text über mich: was ich mache, woran ich arbeite und was mich interessiert.</p>

    <h2>Projekte</h2>
    <ul>
      <li>Projekt eins: kommt bald</li>
      <li>Projekt zwei: kommt bald</li>
    </ul>

    <h2>Kontakt</h2>
    <p><a href="https://github.com/kle73">GitHub</a></p>

    <footer>© 2026 Karl Körner</footer>
  </main>
</body>
</html>
